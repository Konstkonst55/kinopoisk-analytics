services:
  redis:
    image: redis:7-alpine
    container_name: kinopoisk_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: kinopoisk_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      CUDA_VISIBLE_DEVICES: 0
    volumes:
      - ./data:/app/data
      - ./app.log:/app/app.log
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
